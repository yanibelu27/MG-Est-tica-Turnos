<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MG Estética | Administración</title><style>
:root{--p:#b83272;--d:#27212a;--l:#eadde5}*{box-sizing:border-box}body{margin:0;background:#faf7f9;color:var(--d);font:16px system-ui}header{background:linear-gradient(120deg,#351e32,#a83270);color:white;padding:24px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid var(--l);border-radius:16px;padding:18px;margin:14px 0}label{display:block;margin:12px 0 5px;font-weight:650}input,textarea,button{width:100%;padding:12px;border:1px solid #d9cbd4;border-radius:10px;font:inherit}button{background:var(--p);color:white;font-weight:700;border:0;cursor:pointer;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{border-bottom:1px solid var(--l);padding:12px 0}.hidden{display:none}.muted{font-size:14px;color:#746975}.danger{background:#9e284a}footer{text-align:center;padding:20px;color:#777;font-size:12px}
</style></head><body><header><h1>MG Estética · Administración</h1><p>Panel privado</p></header><main><section id="login" class="panel"><h2>Ingresar</h2><label>Email</label><input id="email" type="email"><label>Contraseña</label><input id="pass" type="password"><button id="loginBtn">Iniciar sesión</button><p class="muted" id="msg"></p></section><section id="panel" class="hidden"><div class="panel"><button id="logout" class="danger">Cerrar sesión</button><h2>Agregar servicio</h2><label>Nombre</label><input id="nm"><div class="grid"><div><label>Precio (ARS)</label><input id="pr" inputmode="numeric"></div><div><label>Duración (min)</label><input id="du" type="number" value="30"></div></div><label>Descripción</label><textarea id="desc"></textarea><button id="add">Guardar servicio</button></div><div class="panel"><h2>Servicios</h2><div id="services"></div></div><div class="panel"><h2>Solicitudes de turnos</h2><div id="requests"></div></div></section><footer>MG Estética · Administración</footer></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';import{getFirestore,collection,getDocs,addDoc,updateDoc,doc,deleteDoc}from'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyB_yLOsIAhEkcr1blJK46HAhcWylVI-3v0',authDomain:'mg-estetica-turnos.firebaseapp.com',projectId:'mg-estetica-turnos',storageBucket:'mg-estetica-turnos.firebasestorage.app',messagingSenderId:'425300609473',appId:'1:425300609473:web:45bb97101299ae18b00740'};const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);const ADMIN='lvCsIh1rliWqmsV8cPCCnCCZdHj2';
const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
onAuthStateChanged(auth,u=>{if(u&&u.uid===ADMIN){$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadAll()}else{$('login').classList.remove('hidden');$('panel').classList.add('hidden')}});
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('pass').value);$('msg').textContent='';}catch(e){$('msg').textContent='No se pudo iniciar sesión. Revisá email y contraseña.'}};$('logout').onclick=()=>signOut(auth);
$('add').onclick=async()=>{let name=$('nm').value.trim(),price=$('pr').value.replace(/\D/g,''),duration=Number($('du').value);if(!name||duration<15)return alert('Ingresá nombre y duración válida.');await addDoc(collection(db,'services'),{name,price,duration,description:$('desc').value.trim(),active:true});$('nm').value=$('pr').value=$('desc').value='';loadAll();};
async function loadAll(){let ss=await getDocs(collection(db,'services'));$('services').innerHTML=ss.docs.map(d=>{let s=d.data();return `<div class="row"><b>${esc(s.name)}</b><div class="muted">$${esc(s.price||'Consultar')} · ${esc(s.duration||30)} min</div><button onclick="window.editSvc('${d.id}')">Editar precio/nombre</button><button class="danger" onclick="window.delSvc('${d.id}')">Eliminar</button></div>`}).join('')||'Sin servicios.';let bs=await getDocs(collection(db,'bookingRequests'));$('requests').innerHTML=bs.docs.map(d=>{let b=d.data();return `<div class="row"><b>${esc(b.name)}</b><div>${esc(b.service)} · ${esc(b.date)} ${esc(b.time)}</div><div class="muted">WhatsApp: ${esc(b.phone)} · Estado: ${esc(b.status)}</div><button onclick="window.confirmReq('${d.id}')">Marcar confirmado manualmente</button></div>`}).join('')||'Sin solicitudes.'}
window.editSvc=async id=>{let q=await getDocs(collection(db,'services'));let s=q.docs.find(x=>x.id===id)?.data();if(!s)return;let n=prompt('Nombre',s.name),p=prompt('Precio (solo números)',s.price||''),du=prompt('Duración en minutos',s.duration||30);if(n!==null&&p!==null&&du!==null){await updateDoc(doc(db,'services',id),{name:n,price:p.replace(/\D/g,''),duration:Number(du)});loadAll()}};window.delSvc=async id=>{if(confirm('¿Eliminar servicio?')){await deleteDoc(doc(db,'services',id));loadAll()}};window.confirmReq=async id=>{await updateDoc(doc(db,'bookingRequests',id),{status:'Confirmado manualmente'});loadAll()};
</script></body></html>
